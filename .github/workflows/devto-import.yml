name: Import published posts from dev.to
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mattstratton-dev-to
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - name: Import new published posts
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: npx tsx scripts/import.ts
      - name: Open PR if anything new
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: import/devto-sync
          title: "Import newly published dev.to posts"
          commit-message: "chore: import newly published dev.to posts"
          body: "Auto-generated by the importer. Review and merge to take ownership in git."
          add-paths: mattstratton-dev-to/posts/**
