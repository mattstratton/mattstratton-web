name: Test

# Runs each subproject's suite. No path filters on purpose: the suites take
# under a few seconds, and path-skipped jobs report as neutral, which makes
# "required check" configuration annoying.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No npm workspaces: each subproject has its own package.json + lockfile.
        dir: [".", "mattstratton-dev-to", "mattstratton-speaking"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: npm ci
        working-directory: ${{ matrix.dir }}

      - run: npm test
        working-directory: ${{ matrix.dir }}
